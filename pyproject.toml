[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trhash"
version = "0.2.0.dev0"
description = "Simple prediction, fine-tuning, and serving for TR-Hash Vision models"
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-NC-4.0"
authors = [{name = "AETHORIA AI"}]
dependencies = [
    "httpx>=0.27",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
local = [
    "complexity-framework>=0.3.0",
    "huggingface-hub>=0.27",
    "safetensors>=0.4",
]
export = [
    "complexity-framework>=0.3.0",
    "huggingface-hub>=0.27",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]
torchscript = ["torch>=2.2", "huggingface-hub>=0.27"]
coreml = ["coremltools>=9.0,<10", "huggingface-hub>=0.27"]
tensorrt = [
    "torch>=2.2",
    "tensorrt>=10.0; platform_system == 'Linux'",
    "nvidia-modelopt[onnx]>=0.45; platform_system == 'Linux'",
    "huggingface-hub>=0.27",
]
video = ["numpy>=1.24", "opencv-python-headless>=4.8"]
tracking = ["numpy>=1.24"]
runtime = [
    "numpy>=1.24",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.27",
]
serve = [
    "numpy>=1.24",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
trhash = "trhash.cli:main"
trhash-server = "trhash.server.runner:main"

[project.urls]
Homepage = "https://www.complexity-ai.fr/"
Models = "https://huggingface.co/AETHORIA-AI"
Source = "https://github.com/Complexity-ML/trhash"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
