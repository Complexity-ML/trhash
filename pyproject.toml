[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trhash"
version = "0.1.0.dev0"
description = "Simple prediction, fine-tuning, and serving for TR-Hash Vision models"
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-NC-4.0"
authors = [{name = "AETHORIA AI"}]
dependencies = [
    "httpx>=0.27",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
local = [
    "complexity-framework>=0.3.0",
    "huggingface-hub>=0.27",
    "safetensors>=0.4",
]
serve = [
    "complexity-framework[serve]>=0.3.0",
    "huggingface-hub>=0.27",
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
trhash = "trhash.cli:main"

[project.urls]
Homepage = "https://www.complexity-ai.fr/"
Models = "https://huggingface.co/AETHORIA-AI"
Source = "https://github.com/Complexity-ML"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
